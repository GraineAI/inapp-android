org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The published SDK version. GraineVersion.NAME must match (a unit test checks).
GRAINE_VERSION=0.14.0

# Lint reads the build scripts too, and its K2 front end crashes on graine-inapp/build.gradle.kts
# ("findFirCompiledSymbol only works on compiled declarations", AGP 8.13.2): the K1 one reads them.
android.lint.useK2Uast=false
